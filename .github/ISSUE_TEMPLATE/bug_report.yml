name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Do '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari on iOS 18, Chrome on Android 15
    validations:
      required: true
  - type: checkboxes
    id: data-loss
    attributes:
      label: Does this involve losing session data?
      options:
        - label: Yes, my logbook data was affected
          required: false
