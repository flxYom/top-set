name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate HTML, JSON and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files (manifest, vercel.json)
        run: |
          for f in manifest.webmanifest vercel.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Business logic tests
        run: node test/intelligence.test.mjs

      - name: Template and hardening guards
        run: node test/gabarits.test.mjs

      # La matrice SEO : notes recalculees, pas de cannibalisation (deux pages
      # actives sur la meme URL ou la meme requete), fichiers generes a jour.
      - name: SEO topic matrix
        run: node docs/seo/matrice.mjs --verifier

      # Remplace lychee-action, qui echouait a chaque execution sans qu'on
      # puisse reproduire l'echec en local ni lire utilement son journal. Ce
      # test-ci tourne a l'identique sur une machine de dev et ici, et il
      # attrape les deux pieges que Windows cache : la casse des chemins et
      # les ancres qui ne pointent nulle part.
      - name: Internal links
        run: node test/liens.test.mjs

      - name: Lint HTML
        run: npx --yes html-validate "*.html"

  schema:
    name: Database schema and RLS
    runs-on: ubuntu-latest
    steps:
      # Tout l'historique : le test de montee installe chaque ancienne version
      # du schema avant de passer la nouvelle par-dessus.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ces tests sont la seule chose qui prouve qu'un utilisateur ne peut
      # pas lire le carnet d'un autre. Ils ne tournaient jusqu'ici que sur la
      # machine de la personne qui modifiait le schema, ce qui est exactement
      # l'endroit ou l'on ne veut pas que cette garantie repose.
      - name: Install PGlite
        run: npm ci
        working-directory: supabase/test

      - name: RLS and schema tests
        run: node test-rls.mjs
        working-directory: supabase/test

      # La base de production n'est jamais vide. Une fonction dont on change
      # les colonnes de retour passe sur une base neuve et casse sur la vraie :
      # dans l'editeur SQL de Supabase, tout le script est alors annule.
      - name: Upgrade from every past schema version
        run: node test-montee.mjs
        working-directory: supabase/test
