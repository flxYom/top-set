name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate HTML, JSON and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files (manifest, vercel.json)
        run: |
          for f in manifest.webmanifest vercel.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Lint HTML
        run: npx --yes html-validate "*.html"

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --exclude-mail
            "*.html"
          fail: true
